# Publicación MANUAL de la PWA con GitHub Actions (alternativa a «Deploy from a branch»).
# Uso: Settings → Pages → Source: «GitHub Actions»; luego Actions → «Publicar PWA» → Run workflow.
# Sirve dist/ en la raíz de https://<usuario>.github.io/<repo>/ (URL limpia). Con «Deploy from a branch» no hace falta este workflow.
name: Publicar PWA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Armar la PWA (solo Node, sin dependencias)
        run: node tools/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
